repos:
  # black and mypy run from the active environment, so they use the versions
  # installed with `pip install -e ".[dev]"` (the same ones CI uses).
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black astair2 tests
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: mypy astair2 --ignore-missing-imports
        language: system
        pass_filenames: false

  # pre-commit builds gitleaks itself; it reads .gitleaks.toml from the repo root.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
