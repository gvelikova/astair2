name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install ".[dev]"
      - name: Black
        run: black --check astair2 tests
      - name: Mypy
        run: mypy astair2
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        deps: [latest]
        include:
          # Make sure the lower bounds declared in pyproject.toml really work.
          - python-version: "3.12"
            deps: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimum dependency versions
        if: matrix.deps == 'minimum'
        run: pip install "click==8.1.*" "pysam==0.22.*" "numpy==1.26.*" "matplotlib==3.9.*"
      - name: Install package
        run: pip install ".[plot,test]"
      - name: Run tests
        run: pytest -W error::DeprecationWarning
